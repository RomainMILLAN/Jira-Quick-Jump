name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job may write anything by default. ci.yml must never reference secrets: a
# fork pull request would otherwise run untrusted code with them in scope.
permissions: {}

# A new push to a branch makes the previous run's answer obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Watch what the job talks to
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # audit, not block, and deliberately: an allowlist guessed instead of
          # observed fails the build at the worst moment, and blocks a release
          # rather than an attack. One clean run publishes the real endpoint
          # list; the switch to block is a one-line change afterwards.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: a hostile devDependency must not run code in the job
      # that produces the published artifacts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Lint (addons-linter on the Firefox variant)
        run: npm run lint

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Upload the packages as run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jira-quick-jump-builds
          path: web-ext-artifacts/*.zip
          if-no-files-found: error

  # The workflows are the one place where a mistake grants write access to the
  # repository rather than to a page. zizmor reads them as an attacker would.
  workflows:
    name: Audit the workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Watch what the job talks to
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint before zizmor: it validates the expression LANGUAGE, which
      # zizmor does not. A `secrets` reference in a step `if` is not a security
      # smell, it is a parse error — the whole workflow refuses to start, and
      # release.yml only starts on a tag, so the first time anyone finds out is
      # the release that does not happen. Downloaded and checksum-verified
      # rather than pulled through an action: one fewer party to trust for a
      # step whose entire job is trust.
      - name: Lint the workflow expressions
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Findings land as annotations on the diff. Uploading SARIF instead
          # would need security-events: write, a permission this repository has
          # no other reason to hand out.
          # Pinned like every action SHA in this repository: the default is
          # `latest`, which would silently change what the gate enforces.
          version: 1.29.0
          advanced-security: false
          annotations: true
          # The one informational finding left is `superfluous-actions` on
          # softprops/action-gh-release. Replacing a pinned, attested action with
          # a shell script is not an improvement here, so the floor sits above it
          # rather than the finding being suppressed and forgotten.
          min-severity: low
